[package]
name = "easyssh"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "stop typing flags, make ssh easy - hosts, keys, tunnels, mounts and file copies in one CLI + TUI"
authors = ["Pablo Antonio Hernández Hernández (safteinzz)"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://gitlab.com/safteinzz/easyssh"
keywords = ["ssh", "sshfs", "tui", "cli", "sysadmin"]
categories = ["command-line-utilities", "network-programming"]
# README screenshots are fetched over the network by crates.io via absolute raw
# URLs, never read out of the package, so shipping them would only bloat every download.
exclude = ["readme-assets/"]

# The crate is `easyssh`, but the command you type is the shorter `essh`
# (ssh + one letter - muscle memory carries, no dangerous typo of real `ssh`).
[[bin]]
name = "essh"
path = "src/main.rs"

[dependencies]
anyhow    = "1"                                       # error handling in the config/key engines
clap      = { version = "4", features = ["derive"] } # CLI argument parsing
ratatui   = "0.29"                                    # the TUI (bare `essh`)
crossterm = "0.28"                                    # terminal backend for ratatui + key events
colored   = "2"                                       # colored CLI output (ls, cp)
dirs      = "5"                                        # locate ~/.ssh and the state dir portably
